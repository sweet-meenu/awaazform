<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AwaazForm explainer</title>
<style>
  @font-face { font-family: Inter; src: url(/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Deva; src: url(/node_modules/@fontsource/noto-sans-devanagari/files/noto-sans-devanagari-devanagari-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Deva; src: url(/node_modules/@fontsource/noto-sans-devanagari/files/noto-sans-devanagari-devanagari-600-normal.woff2) format('woff2'); font-weight: 600; }
  :root {
    --ink: #151718; --ink9: #1a1d1e; --muted: #4c5155; --line: #e6e8eb; --sub: #f6f7f9;
    --violet: #624de3; --violet3: #ab9ff4; --violet1: #efedfd; --magenta: #c63af8; --green: #007a34; --green1: #e9f8ef; --amber: #8a5300;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: Inter, Deva, system-ui, sans-serif; color: var(--ink9); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .abs { position: absolute; }
  .bg { position: absolute; inset: 0; }
  .glow { position: absolute; width: 1400px; height: 1000px; border-radius: 50%; filter: blur(90px); }
  .scene { position: absolute; inset: 0; }
  h1, h2, .display { font-weight: 650; letter-spacing: -0.035em; line-height: 1.05; }
  .grad { background: linear-gradient(90deg, #6e56cf, #c27ef0 60%, #6e56cf); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-weight: 600; font-size: 30px; box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 16px 32px rgba(0,0,0,.08); white-space: nowrap; }
  .card { border-radius: 28px; background: linear-gradient(180deg, #fff, var(--sub)); border: 1px solid var(--line); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.10); }
  /* Browser mockup */
  .win { position: absolute; border-radius: 22px; overflow: hidden; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 8px rgba(0,0,0,.06), 0 40px 90px rgba(98,77,227,.28); }
  .win .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); background: #fbfbfc; }
  .win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #e6e8eb; display: inline-block; }
  .win .url { margin-left: 18px; flex: 1; height: 28px; border-radius: 8px; background: var(--sub); color: var(--muted); font-size: 15px; display: flex; align-items: center; padding: 0 14px; }
  .win .vp { position: relative; overflow: hidden; }
  .win .cam { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
  .win .cam img { position: absolute; inset: 0; width: 1600px; height: 1000px; }
  .ring { position: absolute; border: 4px solid var(--violet); border-radius: 18px; box-shadow: 0 0 0 8px rgba(98,77,227,.18); }
  /* Captions */
  #cap { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: max-content; max-width: 1620px; padding: 12px 28px; border-radius: 18px; background: rgba(21,23,24,.86); color: #fff; font-size: 27px; font-weight: 500; line-height: 1.35; text-align: center; backdrop-filter: blur(8px); }
  #cap .who { color: var(--violet3); font-weight: 700; margin-right: 10px; }
  #cap .dim { color: rgba(255,255,255,.5); }
  .bubble { position: absolute; padding: 22px 30px; border-radius: 28px; background: #fff; border: 1px solid var(--line); font-size: 36px; font-weight: 600; box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.12); }
  .bubble.user { background: var(--ink9); color: #fff; border-color: transparent; }
  .wave { display: inline-flex; gap: 5px; align-items: center; height: 40px; vertical-align: middle; }
  .wave b { width: 6px; border-radius: 3px; background: currentColor; display: block; }
  .tile { position: absolute; display: grid; place-items: center; text-align: center; gap: 14px; padding: 30px; border-radius: 30px; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.10); font-size: 30px; font-weight: 650; }
  .tile .ic { font-size: 64px; line-height: 1; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
  .logo .m { width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(135deg, var(--violet), var(--magenta)); display: grid; grid-auto-flow: column; place-items: center; padding: 0 11px; gap: 3px; }
  .logo .m i { width: 5px; border-radius: 3px; background: #fff; display: block; }
  .x { position: absolute; font-weight: 800; color: #e5484d; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bg"></div>
  <div class="glow" id="glowA"></div>
  <div class="glow" id="glowB"></div>
  <div id="scenes"></div>
  <div id="cursor" class="abs" style="z-index:40;width:44px;height:44px;opacity:0">
    <svg width="44" height="44" viewBox="0 0 24 24"><path d="M4 2l16 9-7 2-3 7z" fill="#624de3" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span id="ripple" class="abs" style="left:-26px;top:-26px;width:60px;height:60px;border-radius:50%;border:4px solid #624de3;opacity:0"></span>
  </div>
  <div id="bolu" class="abs" style="z-index:30;width:220px;height:260px;transform-origin:110px 260px"></div>
  <div id="cap"></div>
  <div id="brand" class="abs logo" style="left:56px;top:40px;z-index:35"><span class="m"><i style="height:12px"></i><i style="height:22px"></i><i style="height:14px"></i></span><span id="brandText">AwaazForm</span></div>
</div>

<script>
// ---------------- utilities ----------------
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const backOut = (k) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
/** 0→1 over [a, a+d], eased. */
const p = (t, a, d = 0.6, e = easeOut) => e(clamp((t - a) / d));
/** Pop-in scale with overshoot. */
const pop = (t, a, d = 0.55) => (t < a ? 0 : backOut(clamp((t - a) / d)));
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; return e; };
const vis = (e, o, extra = '') => css(e, { opacity: o, transform: extra });

let TL, R; // timeline, regions
const scene = (id) => TL.scenes.find((s) => s.id === id);
const line = (id) => TL.lines.find((l) => l.id === id);

// ---------------- browser mockup with camera ----------------
class Shot {
  constructor(parent, imgs, url) {
    this.el = el(`<div class="win"><div class="bar"><i></i><i></i><i></i><div class="url">🔒 ${url}</div></div><div class="vp"><div class="cam"></div></div></div>`);
    this.cam = $('.cam', this.el); this.vp = $('.vp', this.el);
    this.imgs = {};
    for (const [k, src] of Object.entries(imgs)) {
      const im = document.createElement('img'); im.src = src; im.style.opacity = 0;
      this.cam.appendChild(im); this.imgs[k] = im;
    }
    parent.appendChild(this.el);
  }
  place(x, y, w, opacity = 1, extra = '') {
    this.w = w; this.h = Math.round(w * 0.625);
    css(this.el, { left: x + 'px', top: y + 'px', width: w + 'px', opacity, transform: extra });
    css(this.vp, { width: w + 'px', height: this.h + 'px' });
  }
  show(map) { for (const k in this.imgs) this.imgs[k].style.opacity = map[k] ?? 0; }
  /** Camera that frames a region (in 1600x1000 screenshot px), or the full page when null. */
  camFor(r, maxZoom = 2.4, pad = 36) {
    const base = this.w / 1600;
    if (!r) return { s: base, x: 0, y: 0 };
    let s = Math.min(this.w / (r.w + pad * 2), this.h / (r.h + pad * 2));
    s = clamp(s, base, maxZoom * base);
    let x = this.w / 2 - (r.x + r.w / 2) * s, y = this.h / 2 - (r.y + r.h / 2) * s;
    x = clamp(x, this.w - 1600 * s, 0); y = clamp(y, this.h - 1000 * s, 0);
    return { s, x, y };
  }
  /** keys: [{t, r, z}] — eases to each key's framing over `d` seconds starting at key.t. */
  camera(t, keys, d = 1.0) {
    let cur = this.camFor(keys[0].r, keys[0].z);
    for (let i = 1; i < keys.length; i++) {
      if (t < keys[i].t) break;
      const next = this.camFor(keys[i].r, keys[i].z);
      const k = p(t, keys[i].t, keys[i].d ?? d, easeIO);
      cur = { s: lerp(cur.s, next.s, k), x: lerp(cur.x, next.x, k), y: lerp(cur.y, next.y, k) };
    }
    this.cur = cur;
    this.cam.style.transform = `translate(${cur.x}px, ${cur.y}px) scale(${cur.s})`;
  }
  /** Maps a screenshot region to stage coordinates under the current camera. */
  toStage(r) {
    const left = parseFloat(this.el.style.left), top = parseFloat(this.el.style.top) + 46;
    return { x: left + this.cur.x + r.x * this.cur.s, y: top + this.cur.y + r.y * this.cur.s, w: r.w * this.cur.s, h: r.h * this.cur.s };
  }
}

// ---------------- Bolu the robot ----------------
const BOLU = `
<svg width="220" height="260" viewBox="0 0 220 260" style="overflow:visible">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a63f0"/><stop offset="1" stop-color="#c63af8"/></linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f4"/></linearGradient>
    <radialGradient id="ballg"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd387"/><stop offset="1" stop-color="#f7a12b"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse id="b-shadow" cx="110" cy="252" rx="62" ry="10" fill="#151718" opacity=".16"/>
  <g id="b-all">
    <g id="b-armL" style="transform-origin:58px 160px"><rect x="22" y="152" width="40" height="22" rx="11" fill="url(#hg)"/><circle cx="24" cy="163" r="13" fill="#ab9ff4"/></g>
    <g id="b-armR" style="transform-origin:162px 160px"><rect x="158" y="152" width="40" height="22" rx="11" fill="url(#hg)"/><circle cx="196" cy="163" r="13" fill="#ab9ff4"/></g>
    <rect x="56" y="128" width="108" height="100" rx="42" fill="url(#bg2)" stroke="#e1e3ea" stroke-width="2"/>
    <rect x="84" y="160" width="52" height="40" rx="14" fill="url(#hg)"/>
    <rect id="b-bar1" x="98" y="172" width="6" height="16" rx="3" fill="#fff"/>
    <rect id="b-bar2" x="107" y="166" width="6" height="28" rx="3" fill="#fff"/>
    <rect id="b-bar3" x="116" y="170" width="6" height="20" rx="3" fill="#fff"/>
    <g id="b-head">
      <line x1="110" y1="44" x2="110" y2="18" stroke="#7a63f0" stroke-width="6" stroke-linecap="round"/>
      <circle id="b-glow" cx="110" cy="14" r="16" fill="#ffd387" filter="url(#soft)" opacity=".7"/>
      <circle cx="110" cy="14" r="10" fill="url(#ballg)"/>
      <circle cx="20" cy="96" r="13" fill="#ab9ff4"/><circle cx="200" cy="96" r="13" fill="#ab9ff4"/>
      <rect x="22" y="38" width="176" height="114" rx="50" fill="url(#hg)"/>
      <rect x="42" y="56" width="136" height="80" rx="36" fill="#151718"/>
      <ellipse cx="80" cy="70" rx="22" ry="6" fill="#fff" opacity=".08"/>
      <g id="b-eyes">
        <rect id="b-eyeL" x="72" y="74" width="20" height="26" rx="10" fill="#bff3ff"/>
        <rect id="b-eyeR" x="128" y="74" width="20" height="26" rx="10" fill="#bff3ff"/>
        <circle cx="86" cy="80" r="3.5" fill="#fff"/><circle cx="142" cy="80" r="3.5" fill="#fff"/>
      </g>
      <circle cx="64" cy="114" r="8" fill="#ff7eb3" opacity=".55"/><circle cx="156" cy="114" r="8" fill="#ff7eb3" opacity=".55"/>
      <path id="b-smile" d="M96 112 Q110 124 124 112" stroke="#bff3ff" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse id="b-mouth" cx="110" cy="116" rx="12" ry="2" fill="#ff8fb1" opacity="0"/>
    </g>
  </g>
</svg>`;

const bolu = { el: null };
function setBolu(t, { x, y, s = 1, wave = 0, point = 0, look = [0, 0], tilt = 0, shake = 0, jump = 0 }) {
  const f = Math.round(t * TL.fps);
  const mouth = TL.mouth[f] ?? 0;
  const bob = Math.sin(t * 2.4) * 7 - jump;
  css(bolu.el, { left: x - 110 + 'px', top: y - 260 + 'px', transform: `scale(${s}) rotate(${tilt + Math.sin(t * 9) * 4 * shake}deg)` });
  $('#b-all', bolu.el).setAttribute('transform', `translate(0 ${bob})`);
  $('#b-shadow', bolu.el).setAttribute('rx', 62 - bob * 0.8);
  const blink = (t % 3.4) > 3.27 ? 0.12 : 1;
  // Eyes look toward the subject and blink (scale about each eye's centre).
  for (const [id, cx] of [['#b-eyeL', 82], ['#b-eyeR', 138]]) {
    $(id, bolu.el).setAttribute('transform', `translate(${look[0] * 6} ${look[1] * 5}) translate(${cx} 87) scale(1 ${blink}) translate(${-cx} -87)`);
  }
  $('#b-mouth', bolu.el).setAttribute('ry', 2 + mouth * 11);
  $('#b-mouth', bolu.el).setAttribute('opacity', mouth > 0.04 ? 1 : 0);
  $('#b-smile', bolu.el).setAttribute('opacity', mouth > 0.04 ? 0 : 1);
  $('#b-glow', bolu.el).setAttribute('opacity', 0.45 + 0.35 * Math.sin(t * 4) + mouth * 0.4);
  [['#b-bar1', 16], ['#b-bar2', 28], ['#b-bar3', 20]].forEach(([id, h], i) => {
    const hh = h * (0.45 + 0.55 * (mouth > 0.04 ? 0.5 + 0.5 * Math.sin(t * 18 + i * 2) : 0.4));
    const b = $(id, bolu.el); b.setAttribute('height', hh); b.setAttribute('y', 180 - hh / 2);
  });
  const armR = wave ? -120 + Math.sin(t * 10) * 28 * wave : point > 0 ? -55 : 12 + Math.sin(t * 2.4) * 4;
  const armL = point < 0 ? 55 : -12 - Math.sin(t * 2.4) * 4;
  $('#b-armR', bolu.el).style.transform = `rotate(${armR}deg)`;
  $('#b-armL', bolu.el).style.transform = `rotate(${armL}deg)`;
  $('#b-head', bolu.el).setAttribute('transform', `rotate(${Math.sin(t * 1.7) * 3 + tilt * 0.3} 110 95)`);
}

// ---------------- scenes ----------------
const S = {}; // id -> {root, render(t)}
const stageEl = () => $('#scenes');

function mkScene(id, html = '') { const r = el(`<div class="scene" id="sc-${id}">${html}</div>`); stageEl().appendChild(r); return r; }

function buildScenes() {
  // 1. intro
  {
    const r = mkScene('intro', `
      <div class="abs bubble" id="i-b" style="left:1010px;top:330px">Hi! I'm <span class="grad">Bolu</span> 👋</div>
      <div class="abs" id="i-sub" style="left:1010px;top:470px;font-size:30px;color:var(--muted);font-weight:500">your helper inside AwaazForm</div>`);
    S.intro = { root: r, render(t) {
      const s = scene('intro');
      vis($('#i-b', r), p(t, 1.6, 0.5), `scale(${0.6 + 0.4 * pop(t, 1.6)})`);
      vis($('#i-sub', r), p(t, 2.6, 0.6), `translateY(${20 * (1 - p(t, 2.6))}px)`);
      return { bolu: { x: 820, y: 720, s: 1.6 * pop(t, 0.3, 0.7), wave: t > 1.2 && t < s.end - 0.6 ? 1 : 0, look: [1, 0] } };
    } };
  }
  // 2. problem — real Form 6 page, tiny boxes, jargon, typing; who struggles
  {
    const r = mkScene('problem', `
      <div class="abs card" id="p-form" style="left:150px;top:140px;width:860px;height:740px;overflow:hidden;padding:0;background:#fff"><canvas id="p-canvas" style="position:absolute;left:0;top:-30px;width:860px"></canvas></div>
      <div class="abs ring" id="p-ring"></div>
      <div class="abs chip" id="p-c1" style="left:960px;top:240px">🔍 Tiny boxes</div>
      <div class="abs chip" id="p-c2" style="left:1010px;top:340px;font-family:Inter">📄 “Pl. specify ERO/AERO/BLO…”</div>
      <div class="abs chip" id="p-c3" style="left:980px;top:440px">⌨️ So much typing</div>
      <div class="abs" id="p-who" style="left:1080px;top:600px;display:grid;gap:18px">
        <div class="chip" id="p-w1">👁️ Can't see well</div>
        <div class="chip" id="p-w2">✋ Hard to type</div>
        <div class="chip" id="p-w3" style="font-family:Deva,Inter">🗣️ हिन्दी is easier</div>
      </div>`);
    S.problem = { root: r, render(t) {
      const c = TL.cues.problem, s = scene('problem');
      vis($('#p-form', r), p(t, s.start, 0.7), `translateY(${40 * (1 - p(t, s.start, 0.8))}px) rotate(${-3 + 2 * p(t, s.start, 1)}deg)`);
      // Ring the tiny character boxes of “First Name” (PDF points → card px).
      const k = 860 / 612, ring = $('#p-ring', r);
      css(ring, { left: 150 + 182 * k + 'px', top: 140 - 30 + (842 - 632) * k + 'px', width: 300 * k + 'px', height: 36 * k + 'px' });
      vis(ring, p(t, c.tiny, 0.3) * (0.6 + 0.4 * Math.sin(t * 6)));
      [['#p-c1', c.tiny], ['#p-c2', c.words], ['#p-c3', c.typing]].forEach(([id, a]) => vis($(id, r), p(t, a, 0.35), `scale(${pop(t, a)}) rotate(${-2 + Math.sin(t * 2 + a) * 1.2}deg)`));
      [['#p-w1', c.see], ['#p-w2', c.type], ['#p-w3', c.hindi]].forEach(([id, a]) => vis($(id, r), p(t, a, 0.35), `translateX(${60 * (1 - p(t, a, 0.5))}px)`));
      return { bolu: { x: 1650, y: 990, s: 1.05, look: [-1, -0.5], tilt: -6 } };
    } };
  }
  // 3. idea — landing page + kinetic tagline
  {
    const r = mkScene('idea', `
      <div class="abs" id="d-words" style="left:0;right:0;top:110px;text-align:center;font-size:96px" class="display">
        <span id="d-w1" class="display" style="display:inline-block">Your voice.</span>
        <span id="d-w2" class="display" style="display:inline-block">Your form.</span>
        <span id="d-w3" class="display grad" style="display:inline-block">Your access.</span>
      </div>`);
    const shot = new Shot(r, { a: 'shots/landing.png' }, 'awaazform.app');
    S.idea = { root: r, render(t) {
      const c = TL.cues.idea, s = scene('idea');
      const up = p(t, s.start + 0.1, 1.0, easeIO);
      shot.place(340, lerp(1080, 290, up), 1240, 1);
      shot.show({ a: 1 });
      shot.camera(t, [{ t: 0, r: null }, { t: c.talking, r: R.landing_hero, z: 1.35, d: 1.4 }]);
      [['#d-w1', c.voice], ['#d-w2', c.form], ['#d-w3', c.access]].forEach(([id, a]) => vis($(id, r), p(t, a - 0.1, 0.4), `translateY(${30 * (1 - p(t, a - 0.1, 0.5))}px) scale(${0.9 + 0.1 * pop(t, a - 0.1)})`));
      return { bolu: { x: 210, y: 930, s: 1.1, look: [1, -0.6], point: 1 } };
    } };
  }
  // 4. confidence loop
  {
    const steps = [['🎙️', 'Listen'], ['✍️', 'Write down'], ['✅', 'Check'], ['🔊', 'Read back']];
    const r = mkScene('loop', `
      <div class="abs display" id="l-title" style="left:0;right:0;top:96px;text-align:center;font-size:64px">The <span class="grad">Confidence Loop</span></div>
      <svg class="abs" id="l-ring" width="760" height="760" style="left:580px;top:130px;transform:scale(.82)"><circle cx="380" cy="380" r="300" fill="none" stroke="#e6e8eb" stroke-width="10"/><circle id="l-arc" cx="380" cy="380" r="300" fill="none" stroke="url(#lg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1885" stroke-dashoffset="1885" transform="rotate(-90 380 380)"/><defs><linearGradient id="lg"><stop offset="0" stop-color="#624de3"/><stop offset="1" stop-color="#c63af8"/></linearGradient></defs></svg>
      ${steps.map(([ic, tx], i) => `<div class="abs chip" id="l-s${i}" style="font-size:34px;padding:18px 28px">${ic} ${tx}</div>`).join('')}
      <div class="abs" id="l-yes" style="left:660px;top:836px;width:600px;text-align:center"><span class="chip" style="background:var(--green);color:#fff;border-color:transparent;font-size:36px;padding:18px 34px">✓ Only after you say yes</span></div>`);
    const pos = [[960, 264], [1206, 510], [960, 756], [714, 510]];
    S.loop = { root: r, render(t) {
      const c = TL.cues.loop, s = scene('loop');
      const cues = [c.listen, c.write, c.check, c.read];

// ---------------- background per scene ----------------
const DARK = new Set(['live', 'outro']);
function renderBg(t) {
  // Dark amount blends across scene boundaries.
  let dark = 0;
  for (const s of TL.scenes) if (DARK.has(s.id)) dark = Math.max(dark, p(t, s.start - 0.2, 0.7, easeIO) * (1 - p(t, s.end - 0.4, 0.6, easeIO)));
  $('#bg').style.background = `linear-gradient(180deg, rgb(${lerp(255, 21, dark)},${lerp(255, 23, dark)},${lerp(255, 24, dark)}) 0%, rgb(${lerp(246, 21, dark)},${lerp(247, 23, dark)},${lerp(249, 24, dark)}) 100%)`;
  css($('#glowA'), { left: 900 + Math.sin(t * 0.21) * 260 + 'px', top: -420 + Math.cos(t * 0.17) * 120 + 'px', background: `radial-gradient(closest-side, rgba(98,77,227,${0.22 + dark * 0.35}), transparent)` });
  css($('#glowB'), { left: -500 + Math.cos(t * 0.19) * 200 + 'px', top: 420 + Math.sin(t * 0.23) * 140 + 'px', background: `radial-gradient(closest-side, rgba(198,58,248,${0.14 + dark * 0.3}), transparent)` });
  $('#brandText').style.color = dark > 0.5 ? '#fff' : 'var(--ink9)';
  css($('#brand'), { opacity: TL.scenes.find((s) => s.id === 'outro').start - 0.3 < t ? 0 : 1 });
  return dark;
}

// ---------------- captions ----------------
function renderCaption(t, dark) {
  const cap = $('#cap');
  const l = TL.lines.find((x) => t >= x.start - 0.15 && t <= x.end + 0.35);
  if (!l || TL.scenes.find((s) => s.id === 'outro').lineStart <= t + 0.15) { cap.style.opacity = 0; return; }
  const k = clamp((t - l.start) / (l.end - l.start));
  const n = Math.round(l.text.length * k);
  cap.innerHTML = `${l.voice === 'user' ? '<span class="who">You:</span>' : ''}${l.text.slice(0, n)}<span class="dim">${l.text.slice(n)}</span>`;
  cap.style.opacity = clamp((t - (l.start - 0.15)) / 0.2) * clamp((l.end + 0.35 - t) / 0.2);
  cap.style.background = dark > 0.5 ? 'rgba(255,255,255,.12)' : 'rgba(21,23,24,.86)';
}

// ---------------- main render ----------------
let lastPose = null;
window.renderFrame = (t) => {
  const dark = renderBg(t);
  let pose = null;
  for (const s of TL.scenes) {
    const sc = S[s.id];
    const fadeIn = s.start === 0 ? 1 : p(t, s.start, 0.45, easeIO), fadeOut = 1 - p(t, s.end - 0.05, 0.45, easeIO);
    const o = fadeIn * fadeOut;
    sc.root.style.opacity = o;
    sc.root.style.visibility = o > 0.001 ? 'visible' : 'hidden';
    if (o > 0.001) {
      const res = sc.render(t);
      // Bolu glides between scene poses.
      if (t >= s.start) {
        const prev = TL.scenes[TL.scenes.indexOf(s) - 1];
        const k = prev ? p(t, s.start, 0.9, easeIO) : 1;
        if (prev && k < 1 && lastPose) {
          const a = S[prev.id].render(t).bolu, b = res.bolu;
          pose = { ...b, x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), s: lerp(a.s ?? 1, b.s ?? 1, k) };
        } else pose = res.bolu;
      }
    }
  }
  if (pose) { setBolu(t, pose); lastPose = pose; }
  renderCaption(t, dark);
};

window.ready = (async () => {
  TL = await (await fetch('timeline.json')).json();
  R = await (await fetch('shots/regions.json')).json();
  bolu.el = $('#bolu'); bolu.el.innerHTML = BOLU;
  buildScenes();
  // The real example form from example_forms/, rendered with pdf.js.
  const pdfjs = await import('/node_modules/pdfjs-dist/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = '/node_modules/pdfjs-dist/build/pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument({ url: '/form6.pdf' }).promise;
  const pg = await doc.getPage(1), vp = pg.getViewport({ scale: 3 });
  const cv = $('#p-canvas'); cv.width = vp.width; cv.height = vp.height;
  await pg.render({ canvas: cv, viewport: vp }).promise;
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  window.renderFrame(0);
  return { duration: TL.duration, fps: TL.fps };
})();

// Preview: ?t=12.5 renders one frame; ?play plays in real time with audio.
const qs = new URLSearchParams(location.search);
window.ready.then(() => {
  if (qs.has('t')) window.renderFrame(Number(qs.get('t')));
  if (qs.has('play')) {
    const a = new Audio('audio/master.wav'); a.play();
    const loop = () => { window.renderFrame(a.currentTime); if (!a.ended) requestAnimationFrame(loop); };
    loop();
  }
});
</script>
