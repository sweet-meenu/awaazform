[project]
name = "awaazform-backend"
version = "0.1.0"
description = "AwaazForm: serves the site and the API (Groq speech-to-text and chat, form fetching, Kokoro voices)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "soundfile>=0.12",
  "kokoro-onnx>=0.4",
]

[tool.uv]
package = false
